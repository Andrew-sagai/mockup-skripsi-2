<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="70" height="84">
  <!-- Lambang Kabupaten Minahasa Selatan -->
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>

  <!-- Pita Atas -->
  <rect x="15" y="4" width="70" height="12" rx="2" fill="#111827"/>
  <text x="50" y="13" font-family="'DM Sans', Arial, sans-serif" font-size="7" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">MINAHASA SELATAN</text>

  <!-- Perisai Luar -->
  <path d="M 20 20 L 80 20 C 80 55 75 85 50 105 C 25 85 20 55 20 20 Z" fill="url(#goldGrad)" stroke="#111827" stroke-width="2"/>
  
  <!-- Perisai Dalam -->
  <path d="M 25 24 L 75 24 C 75 52 71 78 50 96 C 29 78 25 52 25 24 Z" fill="url(#shieldGrad)" stroke="#ffffff" stroke-width="1.2"/>

  <!-- Simbol Pertanian / Padi dan Kapas -->
  <path d="M 33 60 C 33 42 42 34 50 32 C 58 34 67 42 67 60 C 67 74 58 82 50 86 C 42 82 33 74 33 60 Z" fill="#15803d" opacity="0.9"/>
  
  <!-- Bintang Emas -->
  <polygon points="50,36 52,42 58,42 53,46 55,52 50,48 45,52 47,46 42,42 48,42" fill="#facc15" stroke="#713f12" stroke-width="0.5"/>

  <!-- Obor / Pilar Kesejahteraan -->
  <rect x="47" y="52" width="6" height="24" rx="1" fill="#fef08a" stroke="#ca8a04" stroke-width="0.5"/>
  <!-- Api Obor -->
  <path d="M 46 52 C 46 46 50 44 50 44 C 50 44 54 46 54 52 Z" fill="#ef4444"/>

  <!-- Rantai/Padi melengkung -->
  <circle cx="38" cy="56" r="2.5" fill="#facc15"/>
  <circle cx="37" cy="63" r="2.5" fill="#facc15"/>
  <circle cx="39" cy="70" r="2.5" fill="#facc15"/>
  <circle cx="62" cy="56" r="2.5" fill="#facc15"/>
  <circle cx="63" cy="63" r="2.5" fill="#facc15"/>
  <circle cx="61" cy="70" r="2.5" fill="#facc15"/>
</svg>
